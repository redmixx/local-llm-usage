name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Model server and version
  - type: textarea
    id: metrics
    attributes:
      label: Relevant metric names
      description: Do not include private URLs, credentials, prompts, or responses.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
